name: release
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Tag, version and CHANGELOG agree
        run: |
          V=$(go run ./cmd/ctxwinnow --version | cut -d' ' -f2)
          if [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "tag $GITHUB_REF_NAME does not match internal/version.Version $V" >&2
            exit 1
          fi
          grep -q "^## \[$V\] - " CHANGELOG.md || { echo "CHANGELOG.md has no '## [$V] - ' heading" >&2; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Build archives
        run: |
          mkdir -p dist
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              name="ctxwinnow_${V}_${os}_${arch}"
              bin=ctxwinnow
              if [ "$os" = windows ]; then bin=ctxwinnow.exe; fi
              mkdir -p "dist/$name"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "dist/$name/$bin" ./cmd/ctxwinnow
              cp LICENSE README.md "dist/$name/"
              if [ "$os" = windows ]; then
                (cd "dist/$name" && zip -q "../$name.zip" "$bin" LICENSE README.md)
              else
                tar -C "dist/$name" -czf "dist/$name.tar.gz" "$bin" LICENSE README.md
              fi
              rm -rf "dist/$name"
            done
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v h="## [$V] - " 'index($0, h) == 1 {on = 1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file dist/notes.md dist/*.tar.gz dist/*.zip dist/SHA256SUMS
