name: Bug report
description: Something is wrong or crashes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real transcripts or unredacted reports.** Use `--redact`, or describe the shape of the input.
  - type: input
    id: version
    attributes:
      label: ctxwinnow version
      description: Output of `ctxwinnow --version`.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Claude Code version
      placeholder: macOS 15 arm64, Claude Code 2.1.287
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      render: shell
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
      description: Include the error or the relevant lines of a redacted report.
    validations:
      required: true
